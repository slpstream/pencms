[General]
use_ai = false

[Paths]
content_dir = /data/content
content_storage_type = local
assets_dir = /data/assets
assets_storage_type = local
content_auth_method = password
assets_auth_method = password

[Server]
api_port = 8008

[Preview]
; Origin of the PHP public front, as reachable FROM the API process.
; Override with env PENCMS_PREVIEW_BASE_URL. Unset is OK; inspect returns PREVIEW_UNREACHABLE.
; Chromium is not in the default `api` image target. Build `--target inspect`
; (Compose: PENCMS_API_TARGET=inspect) for in-process Playwright.
; Docker → host PHP example: PENCMS_PREVIEW_BASE_URL=http://host.docker.internal:8009
; base_url =

[theme]
active = editorial
directory = /opt/pencms/frontend-php/src/blog/themes
