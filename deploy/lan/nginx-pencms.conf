# PenCMS LAN HTTPS — drop in as /etc/nginx/sites-available/pencms
# Reuses the existing mkcert/self-signed cert for 192.168.5.199
# (same files Rezilienz used). TLS stays on nginx; PHP and FastAPI bind localhost.

server {
    listen 80;
    server_name 192.168.5.199;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 192.168.5.199;

    ssl_certificate     /etc/nginx/certs/rezilienz.crt;
    ssl_certificate_key /etc/nginx/certs/rezilienz.key;

    client_max_body_size 12M;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = / {
        return 302 /blog/;
    }

    # FastAPI: REST, MCP (Streamable HTTP), OAuth AS, discovery
    location /api {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /.well-known/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /oauth/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location = /llms.txt {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static from disk (bypass PHP). Edit this tree if you copy this file —
    # same class of operator field as server_name / cert paths. Default
    # matches deploy/lan/pencms-php.service WorkingDirectory.
    # Do not add a catch-all /assets/ — that prefix includes author media.
    location /fonts/ {
        root /home/user/pencms/frontend-php/public;
        expires 7d;
        add_header Access-Control-Allow-Origin *;
    }
    location /assets/vendor/ {
        root /home/user/pencms/frontend-php/public;
        expires 7d;
    }
    location /assets/fonts/ {
        root /home/user/pencms/frontend-php/public;
        expires 7d;
        add_header Access-Control-Allow-Origin *;
    }
    location /admin/css/ {
        alias /home/user/pencms/frontend-php/src/admin/css/;
        expires 1d;
    }
    # Core admin JS from disk. Missing files (Pro overlay: users.js,
    # settings-sites.js) fall through to PHP so router.php can serve
    # them from PENCMS_PRO_ADMIN.
    location /admin/js/ {
        root /home/user/pencms/frontend-php/src;
        try_files $uri @pencms_php;
        expires 1d;
    }

    # PHP admin + public preview (built-in server + router.php)
    location / {
        proxy_pass http://127.0.0.1:8009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location @pencms_php {
        proxy_pass http://127.0.0.1:8009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
