[pytest]
# Core CI: python -m pytest -m "not pro"
# Combined (PYTHONPATH to pencms-pro): python -m pytest   (full suite, including @pytest.mark.pro)
# Do not put -m "not pro" in addopts — that would skip Pro tests on a combined checkout.
pythonpath = app
testpaths = tests
asyncio_mode = auto
markers =
    playwright: optional Chromium tests; skip if browser missing
    feedback_relay_http: allow POST /register against a mocked relay
    pro: Pro overlay (pencms_pro); skipped unless the overlay is importable
filterwarnings =
    ignore::DeprecationWarning
    ignore::ResourceWarning
